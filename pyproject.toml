[project]
name = "facade-mapper-intel"
version = "0.1.0"
description = "Architecture-aware facade show planning: SAM 3.1 + Muse Spark + Muse Image"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "openai>=1.50",
    "pillow>=10",
    "meta-sam-parser>=0.1.0",
    "python-multipart>=0.0.32",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
